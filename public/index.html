<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishery Data Management System</title>

    <!-- 引入 layui 定制样式 -->
    <link rel="stylesheet" href="css/layui-custom.css">
    <style>
        /* 自定义样式 */
        .layui-body {
            left: 0 !important;
            top: 60px;
        }
        .layui-layout-admin .layui-body {
            left: 0 !important;
        }
        .layui-tab-title {
            border-bottom: 2px solid #5FB878;
        }
        .layui-tab-title li {
            font-weight: bold;
            font-size: 14px;
        }
        /* 确保顶部logo标题不换行 */
        .layui-logo {
            white-space: nowrap;
            width: auto !important;
            min-width: 200px;
        }
        .layui-logo span {
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
        }
        /* 增加操作列宽度并支持横向滚动 */
        .layui-table-cell {
            height: auto;
            line-height: normal;
        }
        /* 确保表格容器可以横向滚动 */
        .layui-table-main {
            overflow-x: auto;
        }
        /* 确保固定列正常工作 */
        .layui-table-fixed {
            position: absolute !important;
            top: 0;
            z-index: 100;
            background: #fff;
        }
        .layui-table-fixed-r {
            right: 0 !important;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }
        /* 确保固定列的操作单元格高度自适应 */
        .layui-table-fixed .layui-table-cell {
            height: auto !important;
            min-height: 60px !important;
        }
        /* 确保表格容器有固定宽度以触发固定列 */
        .layui-table {
            position: relative;
            min-width: 100%;
        }
        .layui-table-box {
            position: relative;
            overflow: hidden;
        }
        /* 确保表格内容区域宽度足够触发固定列 */
        .layui-table-body {
            overflow-x: auto;
            min-width: 100%;
        }
        .layui-table-header {
            overflow-x: auto;
            min-width: 100%;
        }
        /* 操作按钮样式优化 */
        .layui-table .operate-btns {
            white-space: normal;
            display: inline-block;
        }
        .layui-table .operate-btns .layui-btn {
            margin-right: 3px;
            margin-bottom: 3px;
            min-width: 140px;
            padding: 0 12px;
            white-space: nowrap;
            text-align: center;
            height: 30px;
            line-height: 30px;
        }

        /* 电脑端：Generate Purchase 和 Generate Sales 按钮加宽 */
        @media screen and (min-width: 769px) {
            .layui-table .operate-btns .layui-btn[lay-event="generatePurchase"],
            .layui-table .operate-btns .layui-btn[lay-event="generateSales"] {
                min-width: 185px !important;
                width: auto !important;
                padding: 0 20px !important;
                height: 32px !important;
                line-height: 32px !important;
                font-size: 13px !important;
                white-space: nowrap !important;
                box-sizing: border-box !important;
            }
        }

        /* 操作按钮两排堆叠样式 - 用于按钮较多的情况 */
        .layui-table .operate-btns.operate-btns-stacked {
            display: block !important;
            white-space: normal !important;
            width: 100%;
            min-width: 280px;
        }
        .layui-table .operate-btns.operate-btns-stacked .layui-btn {
            display: inline-block;
            margin: 3px 2px;
            float: none;
        }
        /* 第一行按钮：Export, Email, Print, Net Print */
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="exportRow"],
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="sendEmail"],
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="printRow"],
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="netPrintRow"] {
            min-width: 55px !important;
            width: auto !important;
            height: 28px !important;
            line-height: 28px !important;
            padding: 0 8px !important;
            font-size: 12px !important;
        }
        /* 第二行按钮：Edit, Generate Purchase, Delete */
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="edit"],
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="generatePurchase"],
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="del"] {
            min-width: 70px !important;
            width: auto !important;
            height: 28px !important;
            line-height: 28px !important;
            padding: 0 10px !important;
            font-size: 12px !important;
        }
        .layui-table .operate-btns.operate-btns-stacked .layui-btn[lay-event="generatePurchase"] {
            min-width: 110px !important;
        }
        /* 在中等屏幕隐藏按钮文字，只显示图标 */
        @media screen and (max-width: 1400px) {
            .layui-table .operate-btns.operate-btns-stacked .layui-btn span {
                display: none;
            }
            .layui-table .operate-btns.operate-btns-stacked .layui-btn {
                min-width: 32px !important;
                width: 32px !important;
                padding: 0 !important;
                height: 28px !important;
                line-height: 28px !important;
            }
        }

        /* ========== Landing Records 操作按钮两排布局 ========== */
        .landing-operate-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 0;
            min-width: 200px;
        }
        .landing-operate-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-start;
        }
        .landing-operate-row .layui-btn {
            margin: 0 !important;
            height: 26px !important;
            line-height: 26px !important;
            font-size: 12px !important;
        }
        /* 第一行按钮样式 */
        .landing-operate-row:first-child .layui-btn {
            min-width: 55px;
            padding: 0 6px;
        }
        /* 第二行按钮样式 */
        .landing-operate-row:last-child .layui-btn {
            min-width: 50px;
            padding: 0 6px;
        }
        .landing-operate-row:last-child .layui-btn[lay-event="generatePurchase"] {
            min-width: 110px;
        }
        .landing-operate-row:last-child .layui-btn[lay-event="generateSales"] {
            min-width: 80px;
        }
        /* 表格单元格高度自适应 */
        .layui-table-view .layui-table-cell {
            height: auto !important;
            min-height: 70px;
            padding: 4px 8px;
        }

        /* ========== 移动端适配样式 ========== */

        /* 小于 768px 的设备（手机） */
        @media screen and (max-width: 768px) {
            /* 隐藏标题 - 只在电脑端显示 */
            .layui-logo {
                display: none !important;
            }
            /* 顶部导航适配 - 缩小高度 */
            .layui-header {
                height: 44px !important;
                line-height: 44px !important;
                position: fixed !important;
                width: 100% !important;
                top: 0 !important;
                left: 0 !important;
                z-index: 999 !important;
            }
            .layui-nav.layui-layout-right {
                left: 0 !important;
                top: 0 !important;
                right: auto !important;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: nowrap;
                padding: 0;
                height: 44px !important;
            }
            .layui-nav-item {
                line-height: 44px !important;
                height: 44px !important;
            }
            .layui-nav-item a {
                padding: 0 6px !important;
                font-size: 11px !important;
                height: 44px !important;
                line-height: 44px !important;
                display: flex;
                align-items: center;
            }
            .layui-nav-item a i {
                font-size: 14px !important;
                margin-right: 2px !important;
            }
            .layui-nav-item a span {
                font-size: 11px !important;
            }
            /* 语言切换按钮优化 */
            #lang-toggle {
                margin: 0;
                padding: 0 8px;
                height: 26px !important;
                line-height: 26px !important;
                font-size: 11px !important;
            }
            /* 用户下拉菜单 */
            .layui-nav-item cite {
                font-size: 11px !important;
                max-width: 60px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* 主内容区适配 - 增加top值确保不重叠 */
            .layui-body {
                top: 50px !important;
                padding-top: 10px !important;
            }
            .layui-layout-admin .layui-body {
                top: 55px !important;
                padding-top: 10px !important;
            }

            /* Tab 标签适配 - 添加上边距确保可见 */
            .layui-tab {
                position: relative;
                z-index: 1;
                margin-top: 10px !important;
            }
            .layui-tab-title {
                height: auto;
                border-bottom: 1px solid #5FB878;
                overflow-x: auto;
                overflow-y: hidden;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
                position: relative;
                z-index: 10;
                background: #fff;
            }
            .layui-tab-title li {
                display: inline-block;
                font-size: 13px;
                padding: 0 12px;
                min-width: 90px;
                text-align: center;
            }

            /* 表格横向滚动 */
            .layui-table-main,
            .layui-table-box,
            .layui-table-body {
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch;
            }
            .layui-table {
                min-width: 100%;
                width: max-content;
            }
            /* 表格行高优化 */
            .layui-table-cell {
                height: auto;
                line-height: 20px;
                padding: 8px 5px;
                font-size: 13px;
            }

            /* 操作按钮优化 */
            .operate-btns .layui-btn {
                padding: 0;
                height: 28px;
                line-height: 28px;
                margin: 0;
                min-width: auto;
                width: 28px;
                border-radius: 3px;
            }
            /* 移动端只显示图标，隐藏文字 */
            .operate-btns .layui-btn span {
                display: none;
            }
            .operate-btns .layui-btn i {
                margin-right: 0;
                font-size: 14px;
            }
            /* 操作列 - 水平紧凑排列 */
            .layui-table .operate-btns {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 2px;
                justify-content: center;
                align-items: center;
            }
            .operate-btns {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 2px;
                justify-content: center;
            }
            /* 操作列单元格 */
            .layui-table-cell {
                overflow: visible;
                padding: 5px 5px;
            }

            /* Purchase Records landing-operate-container 手机端样式 */
            .layui-table .landing-operate-container {
                display: flex;
                flex-direction: column;
                gap: 2px;
                justify-content: flex-start;
                min-width: auto;
            }
            .landing-operate-container .landing-operate-row {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 2px;
                width: 100%;
            }
            .landing-operate-container .landing-operate-row .layui-btn {
                padding: 0;
                height: 28px;
                line-height: 28px;
                margin: 0;
                min-width: auto;
                width: 28px;
                border-radius: 3px;
            }
            /* 手机端只显示图标，隐藏文字 */
            .landing-operate-container .landing-operate-row .layui-btn span {
                display: none;
            }
            .landing-operate-container .landing-operate-row .layui-btn i {
                margin-right: 0;
                font-size: 14px;
            }
            /* 手机端Generate Sales按钮也和其他按钮一样小 */
            .landing-operate-container .landing-operate-row .layui-btn[lay-event="generateSales"] {
                min-width: auto !important;
                width: 28px;
            }
            /* 手机端Generate Purchase按钮也和其他按钮一样小 */
            .landing-operate-container .landing-operate-row .layui-btn[lay-event="generatePurchase"] {
                min-width: auto !important;
                width: 28px;
            }

            /* 工具栏按钮 - 一行显示并大幅缩小 */
            .layui-btn-container {
                display: flex !important;
                flex-wrap: nowrap !important;
                flex-direction: row !important;
                gap: 3px;
                width: 100%;
                overflow: hidden;
            }
            /* 隐藏导出和搜索按钮 */
            .layui-btn-container .layui-btn-export,
            .layui-btn-container .layui-btn[lay-event="export"],
            .layui-btn-container .layui-btn[lay-event="search"],
            .layui-btn-container .layui-inline {
                display: none !important;
            }
            .layui-btn-container .layui-btn {
                font-size: 10px;
                height: 26px;
                line-height: 26px;
                padding: 0 3px !important;
                margin: 0 !important;
                white-space: nowrap;
                min-width: auto !important;
                max-width: 55px;
                box-sizing: border-box;
                border-radius: 2px;
                overflow: hidden;
                text-overflow: ellipsis;
                float: none !important;
                display: inline-block !important;
            }
            .layui-btn-container .layui-btn i {
                font-size: 12px;
                margin-right: 1px;
            }
            .layui-btn-container .layui-btn span {
                font-size: 10px;
                display: inline-block;
                max-width: 35px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                vertical-align: middle;
            }

            /* 分页器适配 */
            .layui-laypage {
                font-size: 12px;
            }
            .layui-laypage a,
            .layui-laypage span {
                padding: 0 10px;
                height: 28px;
                line-height: 28px;
            }

            /* 表单弹窗适配 */
            .layui-layer {
                width: 95% !important;
                max-width: 500px;
                left: 2.5% !important;
                top: 5% !important;
                height: auto !important;
                max-height: 90vh;
            }
            .layui-layer-content {
                max-height: calc(90vh - 120px);
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .layui-form-item {
                margin-bottom: 15px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
            }
            .layui-form-label {
                width: auto !important;
                min-width: 80px;
                text-align: left;
                margin-bottom: 0;
                float: none;
                display: inline-block;
                padding: 9px 10px 9px 0;
            }
            .layui-input-block {
                margin-left: 0 !important;
                flex: 1;
                min-width: 0;
            }
            .layui-input,
            .layui-select {
                font-size: 14px !important;
                height: 38px !important;
                line-height: 38px !important;
            }
            /* 按钮组适配 */
            .layui-layer-btn {
                padding: 10px 15px !important;
            }
            .layui-layer-btn a {
                height: 40px;
                line-height: 40px;
                padding: 0 20px;
                font-size: 14px;
            }
        }

        /* 超小屏幕（小于 375px） */
        @media screen and (max-width: 375px) {
            /* 顶部导航使用固定定位和更小高度 */
            .layui-header {
                height: 40px !important;
                line-height: 40px !important;
                position: fixed !important;
                width: 100% !important;
                top: 0 !important;
                left: 0 !important;
                z-index: 999 !important;
            }
            .layui-nav.layui-layout-right {
                height: 40px !important;
            }
            .layui-nav-item {
                line-height: 40px !important;
                height: 40px !important;
            }
            .layui-nav-item a {
                padding: 0 4px !important;
                font-size: 10px !important;
                height: 40px !important;
                line-height: 40px !important;
            }
            .layui-nav-item a i {
                font-size: 12px !important;
            }
            .layui-nav-item a span {
                font-size: 10px !important;
            }
            #lang-toggle {
                height: 22px !important;
                line-height: 22px !important;
                font-size: 10px !important;
                padding: 0 6px;
            }
            /* 主内容区进一步下移并增加padding */
            .layui-body {
                top: 45px !important;
                padding-top: 10px !important;
            }
            .layui-layout-admin .layui-body {
                top: 45px !important;
                padding-top: 10px !important;
            }
            /* Tab标签增加上边距确保可见 */
            .layui-tab {
                margin-top: 10px !important;
            }
            .layui-tab-title li {
                font-size: 12px;
                padding: 0 8px;
                min-width: 75px;
            }
            .layui-table-cell {
                font-size: 12px;
                padding: 3px 3px;
            }
            /* 超小屏幕只显示图标，隐藏文字 */
            .operate-btns .layui-btn span {
                display: none;
            }
            .operate-btns .layui-btn i {
                margin-right: 0;
                font-size: 14px;
            }
            .operate-btns .layui-btn {
                padding: 0;
                width: 26px;
                height: 26px;
                line-height: 26px;
            }
            /* 操作列 - 保持紧凑 */
            .layui-table .operate-btns {
                gap: 1px;
            }
            .operate-btns {
                gap: 1px;
            }
        }
    </style>
</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">
    <!-- 顶部导航 -->
    <div class="layui-header">
        <div class="layui-logo" style="left: 15px; line-height: 60px;">
            <i class="layui-icon layui-icon-template-1"></i> <span data-i18n="systemTitle">Fishery Data Management System</span>
        </div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item">
                <a href="data-management.html">
                    <i class="layui-icon layui-icon-set"></i> <span data-i18n="dataManagement">数据管理</span>
                </a>
            </li>
            <li class="layui-nav-item">
                <a href="monthly-statistics.html">
                    <i class="layui-icon layui-icon-chart"></i> <span data-i18n="statistics">统计报告</span>
                </a>
            </li>
            <li class="layui-nav-item">
                <a href="javascript:;">
                    <cite id="username-display" data-i18n="administrator">Administrator</cite>
                </a>
                <dl class="layui-nav-child">
                    <dd><a href="javascript:;" id="logout-btn" data-i18n="logout">Logout</a></dd>
                </dl>
            </li>
            <li class="layui-nav-item">
                <button id="lang-toggle" class="layui-btn layui-btn-xs layui-btn-primary">
                    中文
                </button>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="layui-body">
        <!-- 内容区域 -->
        <div class="layui-tab" lay-filter="main-tab" lay-allowClose="false">
            <ul class="layui-tab-title">
                <li class="layui-this" lay-id="landing" data-i18n="landing">Landing Records</li>
                <li lay-id="purchase" data-i18n="purchase">Purchase Records</li>
                <li lay-id="sales" data-i18n="sales">Sales Records</li>
            </ul>
            <div class="layui-tab-content">
                <!-- 到货记录 -->
                <div class="layui-tab-item layui-show">
                    <table id="landing-table" lay-filter="landing-table"></table>
                </div>

                <!-- 采购记录 -->
                <div class="layui-tab-item">
                    <table id="purchase-table" lay-filter="purchase-table"></table>
                </div>

                <!-- 销售记录 -->
                <div class="layui-tab-item">
                    <table id="sales-table" lay-filter="sales-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 表格工具栏模板 -->
<script type="text/html" id="toolbarTpl">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i> <span data-i18n="add">Add</span>
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-export" lay-event="export" style="display:none;">
            <i class="layui-icon layui-icon-export"></i> <span data-i18n="export">Export</span>
        </button>
        <div class="layui-inline" style="display:none;">
            <input class="layui-input" name="search" id="search-input-{{d.module}}" placeholder="Search..." autocomplete="off">
        </div>
        <button class="layui-btn layui-btn-sm" lay-event="search" style="display:none;"><span data-i18n="search">Search</span></button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="refresh"><span data-i18n="refresh">Refresh</span></button>
    </div>
</script>

<!-- 操作列模板 -->
<script type="text/html" id="operateTpl">
    <div class="operate-btns">
        <a class="layui-btn layui-btn-xs" lay-event="edit" title="Edit">
            <i class="layui-icon layui-icon-edit"></i>
            <span data-i18n="edit">Edit</span>
        </a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" title="Delete">
            <i class="layui-icon layui-icon-delete"></i>
            <span data-i18n="delete">Delete</span>
        </a>
    </div>
</script>

<!-- 到货记录操作列模板 -->
<script type="text/html" id="landingOperateTpl">
    <div class="landing-operate-container">
        <div class="landing-operate-row">
            <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="exportRow" title="Save">
                <i class="layui-icon layui-icon-export"></i>
                <span data-i18n="exportRow">Save</span>
            </a>
            <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="sendEmail" title="Send Email">
                <i class="layui-icon layui-icon-email"></i>
                <span data-i18n="sendEmail">Email</span>
            </a>
            <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="printRow" title="Print PDF">
                <i class="layui-icon layui-icon-print"></i>
