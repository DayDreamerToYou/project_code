<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渔业收购管理系统 - 收货录入</title>

    <!-- 引入 layui 定制样式 -->
    <link rel="stylesheet" href="css/layui-custom.css">
    <link rel="stylesheet" href="css/purchase-landing.css">
</head>
<body>

<div class="layui-layout layui-layout-admin">
    <!-- 顶部导航 -->
    <div class="layui-header">
        <div class="layui-logo" style="line-height: 60px;">
            <a href="index.html" style="color: #fff; text-decoration: none;">
                <i class="layui-icon layui-icon-return"></i> 返回数据管理
            </a>
        </div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item">
                <a href="javascript:;">
                    <cite>收货录入</cite>
                </a>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="layui-body" style="padding: 15px;">
        <fieldset class="layui-elem-field">
            <legend>收货基本信息</legend>
            <div class="layui-field-box">
                <form class="layui-form" lay-filter="landingForm">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">收货日期 <span style="color: red;">*</span></label>
                            <div class="layui-input-inline">
                                <input type="text" name="landingDate" id="landing-date" required lay-verify="required" placeholder="请选择日期" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">供应商 <span style="color: red;">*</span></label>
                            <div class="layui-input-inline">
                                <select name="supplierId" id="supplier-select" lay-verify="required">
                                    <option value="">请选择供应商</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">渔船</label>
                            <div class="layui-input-inline">
                                <select name="boatId" id="boat-select">
                                    <option value="">Please select boat</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">港口 <span style="color: red;">*</span></label>
                            <div class="layui-input-inline">
                                <select name="portId" id="port-select" lay-verify="required">
                                    <option value="">请选择港口</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <fieldset class="layui-elem-field">
            <legend>收货明细</legend>
            <div class="layui-field-box">
                <div style="margin-bottom: 10px;">
                    <button class="layui-btn layui-btn-sm" id="add-detail-btn">
                        <i class="layui-icon layui-icon-add-1"></i> 添加明细
                    </button>
                </div>
                <table id="detail-table" lay-filter="detail-table"></table>

                <div style="margin-top: 15px; padding: 10px; background: #f5f5f5;">
                    <div class="layui-inline">
                        <span>总净重：</span>
                        <strong id="total-green-weight" style="color: #16a34a;">0.00 KG</strong>
                    </div>
                    <div class="layui-inline" style="margin-left: 30px;">
                        <span>总金额：</span>
                        <strong id="total-amount" style="color: #f59e0b;">$0.00</strong>
                    </div>
                </div>
            </div>
        </fieldset>

        <div class="layui-btn-container">
            <button type="button" class="layui-btn layui-btn-primary" id="reset-btn">重置</button>
            <button type="button" class="layui-btn layui-btn-normal" id="save-btn">保存收货</button>
        </div>

        <fieldset class="layui-elem-field" style="margin-top: 20px;">
            <legend>最近收货记录</legend>
            <div class="layui-field-box">
                <table id="landing-list-table" lay-filter="landing-list-table"></table>
            </div>
        </fieldset>
    </div>
</div>

<!-- 明细表格操作模板 -->
<script type="text/html" id="detailOperateTpl">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<!-- 收货记录操作模板 -->
<script type="text/html" id="listOperateTpl">
    <a class="layui-btn layui-btn-xs" lay-event="view">查看</a>
    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="bill">账单</a>
    <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="print">打印</a>
</script>

<!-- 添加明细弹窗模板 -->
<div id="detail-modal-template" style="display: none;">
    <div style="padding: 20px;">
        <form class="layui-form" lay-filter="detailForm">
            <div class="layui-form-item">
                <label class="layui-form-label">鱼种类 <span style="color: red;">*</span></label>
                <div class="layui-input-block">
                    <select name="stockId" id="detail-stock" lay-verify="required">
                        <option value="">请选择鱼种类</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">鱼箱 <span style="color: red;">*</span></label>
                <div class="layui-input-block">
                    <select name="binId" id="detail-bin" lay-verify="required">
                        <option value="">请选择鱼箱</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">桶数量</label>
                <div class="layui-input-block">
                    <input type="number" step="1" min="1" name="binQty" value="1" placeholder="桶数量" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">带桶重量 <span style="color: red;">*</span></label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" name="landedWeight" required lay-verify="required" placeholder="请输入带桶总重量" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">单价 ($)</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" name="price" placeholder="自动获取，可修改" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <div style="padding: 10px; background: #f0f9ff; border: 1px solid #bae6fd;">
                        <div>换算系数：<strong id="preview-conversion">-</strong></div>
                        <div>单个箱重：<strong id="preview-bin-weight">-</strong> KG</div>
                        <div>总箱重（箱重×桶数量）：<strong id="preview-total-bin-weight">-</strong> KG</div>
                        <div style="margin-top: 5px; color: #16a34a;">净重：<strong id="preview-green-weight">0.00</strong> KG</div>
                        <div style="color: #f59e0b;">总价：<strong id="preview-total">$0.00</strong></div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- 账单预览弹窗模板 -->
<div id="bill-modal-template" style="display: none;">
    <div style="padding: 20px;">
        <div class="layui-tab layui-tab-brief" lay-filter="billTab">
            <ul class="layui-tab-title">
                <li class="layui-this">采购账单</li>
                <li>销售账单</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div style="margin-bottom: 15px; padding: 10px; background: #f9fafb;">
                        <p><strong>Purchase ID:</strong> <span id="bill-purchase-id">-</span></p>
                        <p><strong>日期:</strong> <span id="bill-date">-</span></p>
                        <p><strong>供应商:</strong> <span id="bill-supplier">-</span></p>
                    </div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>鱼种类</th>
                                <th>带桶重量</th>
                                <th>净重</th>
                                <th>单价</th>
                                <th>总价</th>
                            </tr>
                        </thead>
                        <tbody id="bill-purchase-items"></tbody>
                    </table>
                </div>
                <div class="layui-tab-item">
                    <div style="margin-bottom: 15px; padding: 10px; background: #f9fafb;">
                        <p><strong>Sales ID:</strong> <span id="bill-sales-id">-</span></p>
                        <p><strong>日期:</strong> <span id="bill-date-2">-</span></p>
                    </div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>鱼种类</th>
                                <th>箱数</th>
                                <th>总重</th>
                                <th>净重</th>
                                <th>单价</th>
                                <th>金额</th>
                            </tr>
                        </thead>
                        <tbody id="bill-sales-items"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入 layui CSS -->
<link href="https://unpkg.com/layui@2.8.0/dist/css/layui.css" rel="stylesheet">
<!-- 引入 layui JS -->
<script src="https://unpkg.com/layui@2.8.0/dist/layui.js"></script>

<!-- 引入 SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- 引入页面逻辑 -->
<script src="js/purchase-landing.js"></script>

</body>
</html>
