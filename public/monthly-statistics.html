<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度采购统计报告</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.8.0/dist/css/layui.css">
    <style>
        body {
            padding: 20px;
            background-color: #f2f2f2;
        }
        .layui-card {
            margin-bottom: 15px;
        }
        .statistics-header {
            padding: 15px 20px;
            background: #fff;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .statistics-header h2 {
            margin: 0;
        }
        .summary-cards {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .summary-card {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .summary-card.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .summary-card.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .summary-card h3 {
            font-size: 14px;
            margin: 0 0 10px 0;
            opacity: 0.9;
        }
        .summary-card .value {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }
        .summary-card .unit {
            font-size: 14px;
            opacity: 0.8;
            margin-left: 5px;
        }
        .filter-form {
            background: #fff;
            padding: 20px;
            border-radius: 4px;
        }
        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .chart-container {
            background: #fff;
            padding: 20px;
            border-radius: 4px;
            min-height: 400px;
        }
        #chartBar, #chartPie {
            width: 100%;
            height: 500px;
        }
        /* 语言切换按钮 */
        #lang-toggle {
            margin-left: 10px;
        }

        /* ==================== 表格按钮样式增强 ==================== */
        /* 表格内所有按钮 - 字体放大和加粗 */
        .layui-table .layui-btn-xs,
        .layui-table .layui-btn-sm,
        .layui-table .layui-btn {
            font-size: 14px !important;
            font-weight: bold !important;
        }

        /* 表格内的按钮图标也相应调整 */
        .layui-table .layui-btn i {
            font-size: 14px !important;
            margin-right: 2px;
        }

        /* 操作列中的按钮容器 */
        .layui-table .operate-btns {
            white-space: nowrap !important;
        }

        .layui-table .operate-btns .layui-btn {
            margin: 0 2px !important;
        }

        /* 确保表格内的按钮字体放大和加粗 */
        .layui-table-cell .layui-btn {
            font-size: 14px !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body>
    <div class="layui-container-fluid">
        <!-- 页面标题 -->
        <div class="statistics-header">
            <h2 data-i18n="title">
                <i class="layui-icon layui-icon-chart"></i>
                月度采购统计报告
            </h2>
            <button class="layui-btn layui-btn-primary layui-btn-sm" id="back-home-btn">
                <i class="layui-icon layui-icon-return"></i> <span data-i18n="backToHome">返回首页</span>
            </button>
        </div>

        <!-- 筛选表单 -->
        <div class="layui-card filter-form">
            <form class="layui-form" lay-filter="filterForm">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label" data-i18n="month">统计月份</label>
                        <div class="layui-input-inline">
                            <input type="text" name="month" id="month-picker" data-i18n-placeholder="selectMonth" placeholder="选择月份" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label" data-i18n="supplier">供应商</label>
                        <div class="layui-input-inline" style="width: 300px;">
                            <select name="supplierIds" id="supplier-select" multiple>
                                <option value="" data-i18n="allSuppliers">全部供应商</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label" data-i18n="stock">鱼种</label>
                        <div class="layui-input-inline" style="width: 300px;">
                            <select name="stockIds" id="stock-select" multiple>
                                <option value="" data-i18n="allStocks">全部鱼种</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button type="button" class="layui-btn layui-btn-normal" id="query-btn">
                            <i class="layui-icon layui-icon-search"></i> <span data-i18n="query">查询</span>
                        </button>
                        <button type="button" class="layui-btn layui-btn-primary" id="reset-btn">
                            <i class="layui-icon layui-icon-refresh"></i> <span data-i18n="reset">重置</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 汇总卡片 -->
        <div class="summary-cards">
            <div class="summary-card green">
                <h3 data-i18n="totalGreenWeight">总净重 (Green Weight)</h3>
                <p class="value" id="total-green-weight">0.00<span class="unit" data-i18n="kg">kg</span></p>
            </div>
            <div class="summary-card orange">
                <h3 data-i18n="totalAmount">总交易金额</h3>
                <p class="value" id="total-amount">0.00<span class="unit" data-i18n="currency">元</span></p>
            </div>
        </div>

        <!-- 视图切换 -->
        <div class="view-toggle">
            <button class="layui-btn layui-btn-primary layui-btn-sm" id="view-table">
                <i class="layui-icon layui-icon-table"></i> <span data-i18n="tableView">表格视图</span>
            </button>
            <button class="layui-btn layui-btn-primary layui-btn-sm" id="view-chart">
                <i class="layui-icon layui-icon-chart"></i> <span data-i18n="chartView">图表视图</span>
            </button>
        </div>

        <!-- 数据表格 -->
        <div class="layui-card" id="table-view">
            <div class="layui-card-body">
                <table id="statistics-table" lay-filter="statistics-table"></table>
            </div>
        </div>

        <!-- 图表视图 -->
        <div class="layui-card chart-container" id="chart-view" style="display: none;">
            <div class="layui-card-body">
                <div id="chartBar"></div>
            </div>
        </div>
        <div class="layui-card chart-container" id="chart-view-pie" style="display: none;">
            <div class="layui-card-body">
                <div id="chartPie"></div>
            </div>
        </div>
    </div>

    <!-- 引入 ECharts -->
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/layui@2.8.0/dist/layui.js"></script>
    <!-- 引入 i18n 模块（必须在 layui.js 之后，monthly-statistics.js 之前） -->
    <script src="js/i18n.js"></script>
    <script src="js/monthly-statistics.js"></script>
</body>
</html>
