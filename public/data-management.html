            .layui-body {

                padding-top: 10px !important;

            .layui-tab {

            }
            .operate-btns .layui-btn i {
                margin-right: 0;
                font-size: 14px;
            }
            .operate-btns .layui-btn {
                padding: 0;
                width: 26px;
                height: 26px;
                line-height: 26px;
            }
            /* 操作列 - 保持紧凑 */
            .layui-table .operate-btns {
                gap: 1px;
            }
            .operate-btns {
                gap: 1px;
            }
        }

</head>

<script>
layui.use(['table', 'layer', 'form', 'element', 'i18n'], function(){
    var table = layui.table;
    var layer = layui.layer;
    var form = layui.form;
    var element = layui.element;
    var i18n = layui.i18n;
    var $ = layui.$;
    var t = i18n.t;

    // 表格配置
    var tableConfigs = {
        'suppliers': {
            cols: [[
                {field: 'SupplierID', title: t('id'), width: 80, sort: true},
                {field: 'SupplierName', title: t('supplierName'), width: 200},
                {field: 'Address', title: t('address'), width: 200},
                {field: 'Person', title: t('contactPerson'), width: 120},
                {field: 'Phone', title: t('phone'), width: 150},
                {field: 'Email', title: 'Email', width: 200},
                {field: 'GST', title: 'GST', width: 150},
                {field: 'QRN', title: 'QRN', width: 150},
                {field: 'FleetName', title: t('fleetName'), width: 200},
                {fixed: 'right', title: t('action'), width: 150, toolbar: '#operateTpl'}
            ]],
            idField: 'SupplierID',
            apiUrl: '../api/data-management.php'
        },
        'fleet': {
            cols: [[
                {field: 'FleetID', title: t('id'), width: 80, sort: true},
                {field: 'FleetName', title: t('fleetName'), width: 300},
                {field: 'BoatCount', title: t('boatCount'), width: 120},
                {field: 'SupplierCount', title: t('supplierCount'), width: 120},
                {fixed: 'right', title: t('action'), width: 150, toolbar: '#operateTpl'}
            ]],
            idField: 'FleetID',
            apiUrl: '../api/fleet.php'
        },
        'boat-management': {
            cols: [[
                {field: 'BoatID', title: t('id'), width: 80, sort: true},
                {field: 'BoatNo', title: t('boatNo'), width: 150},
                {field: 'BoatName', title: t('boatName'), width: 200},
                {field: 'Person', title: t('contactPerson'), width: 150},
                {field: 'FleetNames', title: t('fleetName'), width: 300},
                {fixed: 'right', title: t('action'), width: 150, toolbar: '#operateTpl'}
            ]],
            idField: 'BoatID',
            apiUrl: '../api/boat-management.php'
        },
        'port': {
            cols: [[
                {field: 'PortID', title: t('id'), width: 80, sort: true},
                {field: 'Port', title: t('portName'), width: 300},
                {fixed: 'right', title: t('action'), width: 150, toolbar: '#operateTpl'}
            ]],
            idField: 'PortID',
            apiUrl: '../api/data-management.php'
        },
        'stock': {
            cols: [[
                {field: 'StockID', title: t('id'), width: 200},
                {field: 'Stock', title: t('stockName'), width: 200},
                {field: 'Description', title: t('description'), width: 200},
                {field: 'State', title: t('state'), width: 100},
                {field: 'Area', title: t('area'), width: 100},
                {field: 'Price', title: t('price'), width: 100},
                {field: 'Conversion', title: t('conversion'), width: 100},
                {field: 'ScientificName', title: t('scientificName'), width: 200},
                {fixed: 'right', title: t('action'), width: 150, toolbar: '#operateTpl'}
            ]],
            idField: 'StockID',
            apiUrl: '../api/data-management.php'
        },
        'bin': {
            cols: [[
                {field: 'BinID', title: t('id'), width: 80, sort: true},
                {field: 'BinName', title: t('binName'), width: 300},
                {field: 'B-Weight', title: t('binWeight'), width: 150},
                {fixed: 'right', title: t('action'), width: 150, toolbar: '#operateTpl'}
            ]],
            idField: 'BinID',
            apiUrl: '../api/data-management.php'
        },
        'price': {
            cols: [[
                {type: 'checkbox'},
                {field: 'PriceID', title: 'ID', width: 80, sort: true},
                {field: 'SupplierName', title: t('supplierName'), width: 200},
                {field: 'Stock', title: t('fishSpecies'), width: 150},
                {field: 'State', title: t('origin'), width: 120},
                {field: 'Area', title: t('seaArea'), width: 120},
                {
                    field: 'UnitPrice',
                    title: t('unitPrice'),
                    width: 100,
                    templet: function(d){
                        return '$' + parseFloat(d.UnitPrice).toFixed(2);
                    }
                },
                {
                    field: 'is_del',
                    title: t('status'),
                    width: 100,
                    templet: function(d){
                        return d.is_del == 0 ? '<span style="color:green;">' + t('enabled') + '</span>' : '<span style="color:red;">' + t('disabled') + '</span>';
                    }
                },
                {field: 'Remark', title: t('remark'), width: 200},
                {fixed: 'right', title: t('action'), toolbar: '#priceOperateTpl', width: 180, align: 'center'}
            ]],
            idField: 'PriceID',
            apiUrl: '../api/supplier-stock-price.php'
        },
        'printer': {
            cols: [[
                {type: 'checkbox'},
                {field: 'id', title: 'ID', width: 80, sort: true},
                {field: 'printer_name', title: t('printerName') || '打印机名称', width: 200},
                {field: 'printer_ip', title: t('printerIP') || 'IP地址', width: 150},

                {field: 'printer_type', title: t('printerType') || '打印机类型', width: 150},
                {

                    templet: function(d){
                        return d.is_default == 1 ? '<span style="color:green;">' + (t('yes') || '是') + '</span>' : (t('no') || '否');
                    }
                },
                {
                    field: 'status',
                    title: t('status'),
                    width: 100,
                    templet: function(d){
                        return d.status == 1 ? '<span style="color:green;">' + t('enabled') + '</span>' : '<span style="color:red;">' + t('disabled') + '</span>';

    // 渲染表格的函数
    function renderTable(tableType) {
        var config = tableConfigs[tableType];
        currentTableType = tableType;

        // 检测屏幕宽度，设置操作列宽度
        // 2个按钮×28px + 1个间距×2px + padding ≈ 70-75px
        var isMobile = window.innerWidth <= 768;
        var isSmallMobile = window.innerWidth <= 375;
        var actionWidth = isSmallMobile ? 70 : (isMobile ? 75 : 150);

        // 深拷贝列配置并调整操作列宽度
        var cols = JSON.parse(JSON.stringify(config.cols));
        cols[0].forEach(function(col){
            if (col.fixed === 'right') {
                col.width = actionWidth;
            }
        });

        // 使用配置的 apiUrl
        var apiUrl = config.apiUrl + '?action=list';

        // price 表格使用 supplier-stock-price.php API (特殊处理)
        if (tableType === 'price') {
            table.render({
                elem: '#' + tableType + '-table',
                url: apiUrl,
                toolbar: '#toolbarTpl',
                defaultToolbar: [],
                page: true,
                limit: 20,
                limits: [10, 20, 50, 100],
                cellMinWidth: isMobile ? 60 : 80,
                size: isMobile ? 'sm' : 'lg',
                parseData: function(res) {
                    return {
                        "code": res.code,
                        "msg": res.msg,
                        "count": res.count,
                        "data": res.data
                    };
                },
                cols: cols
            });
        } else if (tableType === 'fleet' || tableType === 'boat-management' || tableType === 'printer' || tableType === 'units') {
            // fleet, boat-management, printer 和 units 使用独立 API
            $.ajax({
                url: apiUrl,
                type: 'GET',
                success: function(res){
                    if(res.success && res.data){
                        // 使用前端分页渲染表格
                        table.render({
                            elem: '#' + tableType + '-table',
                            data: res.data,
                            toolbar: '#toolbarTpl',
                            defaultToolbar: [],
                            page: true,
                            limit: 20,
                            limits: [10, 20, 50, 100],
                            cellMinWidth: isMobile ? 60 : 80,
                            size: isMobile ? 'sm' : 'lg',
                            cols: cols
                        });
                    } else {
                        layer.msg(t('operationFailed'), {icon: 2});
                    }
                },
                error: function(){
                    layer.msg(t('networkError'), {icon: 2});
                }
            });
        } else {
            // 其他表格使用 data-management.php API
            $.ajax({
                url: '../api/data-management.php?action=list&table=' + tableType,
                type: 'GET',
                success: function(res){
                    if(res.success && res.data){
                        // 使用前端分页渲染表格
                        table.render({
                            elem: '#' + tableType + '-table',
                            data: res.data,
                            toolbar: '#toolbarTpl',
                            defaultToolbar: [],
                            page: true,
                            limit: 20,
                            limits: [10, 20, 50, 100],
                            cellMinWidth: isMobile ? 60 : 80,
                            size: isMobile ? 'sm' : 'lg',
                            cols: cols
                        });
                    } else {
                        layer.msg(t('operationFailed'), {icon: 2});
                    }
                },
                error: function(){
                    layer.msg(t('networkError'), {icon: 2});
                }
            });
        }
    }

                renderTable(tableType);
            }
        });

        // 监听行工具事件
        table.on('tool(' + tableType + '-table)', function(obj){
            var data = obj.data;
            var idField = tableConfigs[tableType].idField;

            if(obj.event === 'edit'){
                openFormDialog(tableType, data);
            } else if(obj.event === 'del'){
                layer.confirm(t('deleteRecordConfirm'), {
                    title: t('deleteTitle'),
                    btn: [t('confirm'), t('cancel')]
                }, function(index){
                    deleteRecord(tableType, data[idField], index);
                });
            } else if (tableType === 'printer') {
                // 打印机专用操作
                if(obj.event === 'test'){

    // 打开表单对话框
    function openFormDialog(tableType, data){
        var isEdit = data !== null && data !== undefined;
        var title = (isEdit ? t('edit') : t('add')) + ' ' + titles[tableType];
        var fields = formFields[tableType];
        var idField = tableConfigs[tableType].idField;

        // 对于 price 表格，需要先加载供应商和鱼种数据
        if (tableType === 'price') {
            $.ajax({
                url: '../api/supplier-stock-price.php?action=suppliers',
                type: 'GET',
                success: function(supplierRes){
                    var suppliers = supplierRes.data || [];
                    $.ajax({
                        url: '../api/supplier-stock-price.php?action=stock',
                        type: 'GET',
                        success: function(stockRes){
                            var stocks = stockRes.data || [];
                            renderPriceForm(isEdit, data, suppliers, stocks);
                        }
                    });
                }
            });
        } else if (tableType === 'suppliers') {
            // 供应商表单需要加载船队列表
            $.ajax({
                url: '../api/fleet.php?action=list',
                type: 'GET',
                success: function(fleetRes){
                    var fleets = fleetRes.data || [];
                    renderSuppliersForm(isEdit, data, fleets);
                }
            });
        } else if (tableType === 'fleet') {
            // 船队表单需要加载船只列表
            $.ajax({
                url: '../api/boat-management.php?action=available-boats',
                type: 'GET',
                success: function(boatRes){
                    var boats = boatRes.data || [];
                    // 如果是编辑模式，需要加载已关联的船只
                    if (isEdit) {
                        $.ajax({
                            url: '../api/fleet.php?action=boats&fleetId=' + data.FleetID,
                            type: 'GET',
                            success: function(selectedRes){
                                var selectedBoats = selectedRes.data || [];
                                renderFleetForm(isEdit, data, boats, selectedBoats);
                            }
                        });
                    } else {
                        renderFleetForm(isEdit, data, boats, []);
                    }
                }
            });
        } else if (tableType === 'boat-management') {
            // 船舶表单需要加载船队列表
            $.ajax({
                url: '../api/boat-management.php?action=available-fleets',
                type: 'GET',
                success: function(fleetRes){
                    var fleets = fleetRes.data || [];
                    // 如果是编辑模式，需要加载已关联的船队
                    if (isEdit) {
                        $.ajax({
                            url: '../api/boat-management.php?action=fleets&boatId=' + data.BoatID,
                            type: 'GET',
                            success: function(selectedRes){
                                var selectedFleets = selectedRes.data || [];
                                renderBoatManagementForm(isEdit, data, fleets, selectedFleets);
                            }
                        });
                    } else {
                        renderBoatManagementForm(isEdit, data, fleets, []);
                    }
                }
            });
        } else {
            renderRegularForm(tableType, isEdit, data);
        }
    }

    // 渲染普通表单
    function renderRegularForm(tableType, isEdit, data) {
        var fields = formFields[tableType];
        var formHtml = '<form class="layui-form" style="padding: 20px;" id="dataForm">';

        for(var i = 0; i < fields.length; i++){
            var field = fields[i];

            // 处理主键字段
            if(field.isPrimaryKey){
                if(isEdit){
                    // 编辑模式：主键作为隐藏字段
                    formHtml += '<input type="hidden" name="' + field.name + '" value="' + (data[field.name] || '') + '">';
                    continue;
                } else if(!field.showInAddForm){
                    // 添加模式：如果不需要在添加表单中显示（自增主键），跳过
                    continue;
                }
                // 如果showInAddForm为true（如stock表），继续正常显示字段
            }

            var value = isEdit ? (data[field.name] || '') : '';

            formHtml += '<div class="layui-form-item">';
            formHtml += '<label class="layui-form-label">' + field.label + '</label>';
            formHtml += '<div class="layui-input-block">';
            // 对于包含连字符的字段名（如 B-Weight），使用 data-field 属性存储真实字段名
            var inputName = field.name.includes('-') ? 'field_' + i : field.name;
            var dataFieldAttr = field.name.includes('-') ? ' data-field="' + field.name + '"' : '';
            var inputType = (field.name === 'B-Weight') ? 'number' : 'text';
            formHtml += '<input type="' + inputType + '" name="' + inputName + '" value="' + value + '" ' +
                       'placeholder="' + t('pleaseInput') + field.label + '" autocomplete="off" class="layui-input" ' +
                       dataFieldAttr +
                       (field.required ? 'required lay-verify="required"' : '') + '>';
            formHtml += '</div></div>';
        }

        formHtml += '</form>';
        openFormDialogLayer(tableType, isEdit, formHtml, data);
    }

        // 根据屏幕大小设置弹窗尺寸
        var isMobile = window.innerWidth <= 768;
        var dialogWidth = isMobile ? '95%' : '500px';
        var dialogHeight = isMobile ? '90%' : '80%';

        layer.open({
            type: 1,
            title: (isEdit ? t('edit') : t('add')) + ' ' + titles[tableType],
            area: [dialogWidth, dialogHeight],
            content: formHtml,
            btn: [t('confirm'), t('cancel')],
            // 移动端优化
            resize: isMobile,
            move: !isMobile,
            yes: function(index, layero){
                // 获取表单数据
                var formData = {};
                layero.find('#dataForm').find('input, select').each(function(){
                    var $input = $(this);
                    var name = $input.attr('name');
                    var value = $input.val();

                    // 如果字段有 data-field 属性（用于处理包含连字符的字段名），使用真实字段名
                    var dataField = $input.attr('data-field');
                    var fieldName = dataField || name;

                    if(fieldName){
                        formData[fieldName] = value;
                    }
                });

                // 处理复选框多选
                if(tableType === 'fleet' || tableType === 'boat-management'){
                    var checkboxName = tableType === 'fleet' ? 'BoatIDs' : 'FleetIDs';
                    var checkedValues = [];
                    layero.find('#dataForm').find('input[type="checkbox"]:checked').each(function(){
                        checkedValues.push($(this).val());
                    });
                    formData[checkboxName] = checkedValues;
                }

                saveRecord(tableType, formData, isEdit, index);
            }
        });

        form.render();
        form.render('select');
    }

    // 保存记录
    function saveRecord(tableType, formData, isEdit, index){
        var action = isEdit ? 'edit' : 'add';
        var url, method;

        // price 表格使用 supplier-stock-price.php API
        if (tableType === 'price') {
            url = '../api/supplier-stock-price.php';
            method = isEdit ? 'PUT' : 'POST';
        } else if (tableType === 'fleet') {
            url = '../api/fleet.php?action=' + action;
            method = 'POST';
        } else if (tableType === 'boat-management') {
            url = '../api/boat-management.php?action=' + action;
            method = 'POST';
        } else if (tableType === 'printer') {
            url = '../api/printer.php?action=' + action;
            method = 'POST';
        } else if (tableType === 'units') {
            url = '../api/units.php?action=' + action;
            method = 'POST';
        } else {
            url = '../api/data-management.php?action=' + (isEdit ? 'update' : 'add') + '&table=' + tableType;
            method = 'POST';
        }

        $.ajax({
            url: url,
            type: method,
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(res){
                var isSuccess = tableType === 'price' ? res.code === 0 : res.success;
                if(isSuccess){
                    // 根据操作类型显示不同的成功消息
                    var successMsg = isEdit ? t('updateSuccess') : t('addSuccess');
                    layer.msg(successMsg, {icon: 1});
                    layer.close(index);
                    renderTable(tableType);
                } else {
                    // 显示详细错误信息（开发调试用）
                    var errorMsg = t('operationFailed');
                    var resMsg = tableType === 'price' ? res.msg : res.error;
                    if(resMsg){
                        errorMsg += ': ' + resMsg;
                    }
                    layer.msg(errorMsg, {icon: 2});
                    console.error('保存失败:', res);
                }
            },
            error: function(xhr, status, error){
                console.error('请求失败:', xhr, status, error);
                layer.msg(t('networkError'), {icon: 2});
            }
        });
    }

    // 删除记录
    function deleteRecord(tableType, id, index){
        var url, method, data;

        // price 表格使用 supplier-stock-price.php API (DELETE 请求)
        if (tableType === 'price') {
            url = '../api/supplier-stock-price.php?id=' + id;
            method = 'DELETE';
        } else if (tableType === 'fleet') {
            url = '../api/fleet.php?action=delete';
            method = 'POST';
            data = JSON.stringify({id: id});
        } else if (tableType === 'boat-management') {
            url = '../api/boat-management.php?action=delete';
            method = 'POST';
            data = JSON.stringify({id: id});
        } else if (tableType === 'printer') {
            url = '../api/printer.php?action=delete';
            method = 'POST';
            data = JSON.stringify({id: id});
        } else if (tableType === 'units') {
            url = '../api/units.php?action=delete';
            method = 'POST';
            data = JSON.stringify({id: id});
        } else {
            url = '../api/data-management.php?action=delete&table=' + tableType;
            method = 'POST';
            data = JSON.stringify({id: id});
        }

        $.ajax({
            url: url,
            type: method,
            contentType: 'application/json',
            data: data,
            success: function(res){
                var isSuccess = tableType === 'price' ? res.code === 0 : res.success;
                if(isSuccess){
                    layer.msg(t('deleteSuccess'), {icon: 1});
                    layer.close(index);
                    renderTable(tableType);
                } else {
                    layer.msg(t('deleteFailed'), {icon: 2});
                }
            },
            error: function(){
                layer.msg(t('networkError'), {icon: 2});
            }
        });
    }

    /**
     * 测试打印机连接
     */
    function testPrinterConnection(printer) {
        layer.load(1);

        fetch('../api/printer.php', {
            method: 'POST',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: 'test',
                printer_ip: printer.printer_ip,
                printer_port: printer.printer_port
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
            layer.closeAll('loading');
            if (result.success) {
                layer.msg(result.message || (t('testSuccess') || '测试成功，请检查打印机是否输出测试页'), {
                    icon: 1,
                    time: 3000
                });
            } else {
                layer.msg(result.message || (t('testFailed') || '测试失败，请检查打印机连接'), {
                    icon: 2,
                    time: 5000
                });
            }
        })
        .catch(function(err) {
            layer.closeAll('loading');
            console.error('测试打印机失败:', err);
            layer.msg((t('testError') || '测试出错') + ': ' + (err.message || '未知错误'), {icon: 2});
        });
    }
