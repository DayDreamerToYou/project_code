<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试单位字段</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.8.0/dist/css/layui.css">
    <style>
        body { padding: 20px; }
        .test-result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="layui-container">
        <fieldset class="layui-elem-field layui-field-title">
            <legend>单位字段测试</legend>
        </fieldset>

        <div class="layui-btn-container">
            <button class="layui-btn" onclick="test1()">测试1: 检查单位列表加载</button>
            <button class="layui-btn" onclick="test2()">测试2: 检查新增明细行</button>
            <button class="layui-btn" onclick="test3()">测试3: 检查数据收集</button>
        </div>

        <div id="result" class="test-result" style="display:none;">
            <h3>测试结果：</h3>
            <pre id="result-content"></pre>
        </div>
    </div>

    <script src="https://unpkg.com/layui@2.8.0/dist/layui.js"></script>
    <script src="https://unpkg.com/jquery@3.6.0/dist/jquery.min.js"></script>
    <script>
        layui.use(['layer'], function(){
            window.layer = layui.layer;
        });

        function showResult(title, data) {
            $('#result').show();
            $('#result-content').html(JSON.stringify(data, null, 2));
            layer.msg(title);
        }

        function test1() {
            // 测试单位列表加载
            $.ajax({
                url: '../api/landing-options.php',
                method: 'GET',
                success: function(res){
                    if (res.success && res.data.units) {
                        showResult('✅ 单位列表加载成功', {
                            count: res.data.units.length,
                            units: res.data.units
                        });
                    } else {
                        showResult('❌ 单位列表加载失败', res);
                    }
                },
                error: function(xhr){
                    showResult('❌ 请求失败', {status: xhr.status, error: xhr.statusText});
                }
            });
        }

        function test2() {
            // 测试新增明细行的默认数据
            var testRow = {
                StockID: '',
                BinID: '',
                'L-Weight': '',
                WeightUnitID: 1,  // 应该有这个字段
                ICE: 0,
                Price: 0
            };

            showResult('✅ 新增明细行默认数据', {
                message: '新增行应包含 WeightUnitID 字段',
                data: testRow,
                hasWeightUnitId: testRow.hasOwnProperty('WeightUnitID'),
                weightUnitIdValue: testRow.WeightUnitID
            });
        }

        function test3() {
            // 测试数据收集逻辑
            var mockSelects = `
                <div style="display:none;">
                    <select class="detail-unit-select">
                        <option value="1" selected>KG</option>
                        <option value="2">LB</option>
                    </select>
                    <select class="detail-stock-select">
                        <option value="BCO">BCO</option>
                    </select>
                    <select class="detail-state-select">
                        <option value="GRE">GRE</option>
                    </select>
                    <select class="detail-bin-select">
                        <option value="1">1</option>
                    </select>
                    <input class="detail-binqty-input" value="2">
                    <select class="detail-ice-select">
                        <option value="0">No</option>
                    </select>
                    <input class="detail-weight-input" value="50.5">
                    <input class="detail-price-input" value="10.0">
                </div>
            `;

            $('body').append(mockSelects);

            // 模拟收集
            var weightUnitId = $('.detail-unit-select').val();
            var hasUnitField = $('.detail-unit-select').length > 0;

            // 清理
            $('body > div > div').last().remove();

            showResult('✅ 数据收集测试', {
                hasUnitField: hasUnitField,
                weightUnitId: weightUnitId,
                unitSelectorExists: $('.detail-unit-select').length > 0,
                message: '单位选择器应该存在并能获取值'
            });
        }
    </script>
</body>
</html>
