<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Units Tab</title>
    <link href="https://unpkg.com/layui@2.8.0/dist/css/layui.css" rel="stylesheet">
</head>
<body>
    <div style="padding: 20px;">
        <h2>Units Tab Test</h2>

        <div class="layui-tab">
            <ul class="layui-tab-title">
                <li class="layui-this" lay-id="suppliers">Supplier Management</li>
                <li lay-id="units">Unit Management</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <p>Supplier tab content</p>
                </div>
                <div class="layui-tab-item">
                    <p>Units tab content - This should be visible</p>
                    <table id="units-table" lay-filter="units-table"></table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/layui@2.8.0/dist/layui.js"></script>
    <script>
    layui.use(['element', 'table'], function(){
        var element = layui.element;
        var table = layui.table;

        // Test render units table
        table.render({
            elem: '#units-table',
            data: [
                {UnitID: 1, UnitCode: 'KG', UnitName: 'Kilogram', UnitSymbol: 'kg', SortOrder: 1},
                {UnitID: 2, UnitCode: 'LB', UnitName: 'Pound', UnitSymbol: 'lb', SortOrder: 2}
            ],
            cols: [[
                {field: 'UnitID', title: 'ID', width: 80},
                {field: 'UnitCode', title: 'Unit Code', width: 120},
                {field: 'UnitName', title: 'Unit Name', width: 200},
                {field: 'UnitSymbol', title: 'Unit Symbol', width: 120},
                {field: 'SortOrder', title: 'Sort Order', width: 100}
            ]]
        });

        console.log('Units tab test loaded');
    });
    </script>
</body>
</html>
