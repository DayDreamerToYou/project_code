# ============================================
# Nginx 前端配置文件
# ============================================
# 功能说明：
# 1. 提供前端静态文件服务（HTML, CSS, JS, 图片等）
# 2. 代理 API 请求到后端 Laravel 服务
# 3. 启用 Gzip 压缩优化传输性能
# 4. 配置缓存策略提升加载速度
# 5. 添加安全头部防止常见攻击
# ============================================

server {
    # ============================================
    # 基础配置
    # ============================================
    
    # 监听端口 80（HTTP 默认端口）
    # Docker 容器内部端口，映射到宿主机的 8080 端口
    listen 80;
    
    # 服务器名称
    # localhost: 本地开发环境使用
    # 生产环境应改为实际域名，如: example.com
    server_name localhost;
    
    # 网站根目录
    # /usr/share/nginx/html: Docker 容器内的静态文件目录
    # 对应宿主机的 ./frontend/public 目录（通过 Docker volumes 挂载）
    root /usr/share/nginx/html;
    
    # 默认首页文件
    # 当访问目录时，Nginx 会按顺序查找这些文件
    # index.html: 单页应用（SPA）的入口文件
    # index.htm: 传统静态页面（备用）
    index index.html index.htm;
    
    # ============================================
    # 日志配置
    # ============================================
    
    # 访问日志路径
    # 记录所有 HTTP 请求信息（IP、时间、请求路径、状态码等）
    # 用于分析访问流量、排查问题
    access_log /var/log/nginx/access.log;
    
    # 错误日志路径
    # 记录 Nginx 运行错误、代理错误等
    # 用于排查服务器故障
    error_log /var/log/nginx/error.log;
    
    # ============================================
    # Gzip 压缩配置
    # ============================================
    # 作用：压缩响应数据，减少传输大小，提升加载速度
    # ============================================
    
    # 启用 Gzip 压缩
    # on: 开启压缩功能
    gzip on;
    
    # 根据请求头中的 Accept-Encoding 启用压缩
    # on: 在响应头中添加 Vary: Accept-Encoding
    # 作用：告诉缓存服务器根据客户端能力返回压缩或未压缩版本
    gzip_vary on;
    
    # 最小压缩大小
    # 1024: 只压缩大于 1KB 的响应
    # 原因：小文件压缩收益不大，反而增加 CPU 开销
    gzip_min_length 1024;
    
    # 需要压缩的文件类型
    # text/plain: 纯文本
    # text/css: CSS 样式文件
    # text/xml: XML 数据
    # text/javascript: JavaScript 文件
    # application/javascript: JavaScript 文件（新标准）
    # application/json: JSON 数据（API 响应）
    # application/xml: XML 数据
    # application/xml+rss: RSS 订阅源
    # image/svg+xml: SVG 矢量图（文本格式）
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/json application/xml 
               application/xml+rss image/svg+xml;
    
    # ============================================
    # 前端静态文件路由
    # ============================================
    # 处理前端页面和静态资源请求
    # ============================================
    
    location / {
        # 尝试文件查找规则
        # $uri: 精确匹配请求路径（如 /about.html）
        # $uri/: 匹配目录（如 /about/）
        # /index.html: 都不匹配时返回 index.html（SPA 路由支持）
        # 
        # 为什么需要 /index.html？
        # 单页应用（SPA）使用前端路由，所有路由都应返回 index.html
        # 例如：访问 /landing、/purchase 等路由，实际需要加载 index.html
        # 前端 JavaScript 会根据 URL 路径渲染对应页面
        try_files $uri $uri/ /index.html;
        
        # ============================================
        # 安全头部配置
        # ============================================
        # 防止常见 Web 安全漏洞
        # ============================================
        
        # X-Frame-Options: 防止点击劫持攻击
        # SAMEORIGIN: 只允许同源页面嵌入 iframe
        # 攻击场景：恶意网站将你的网站嵌入 iframe，诱导用户点击
        # always: 无论响应状态码如何都添加此头部
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # X-Content-Type-Options: 防止 MIME 类型嗅探
        # nosniff: 强制浏览器使用服务器声明的 Content-Type
        # 攻击场景：浏览器可能将非执行文件误判为可执行文件
        add_header X-Content-Type-Options "nosniff" always;
        
        # X-XSS-Protection: 启用浏览器 XSS 过滤器
        # 1: 启用保护
        # mode=block: 检测到攻击时阻止页面加载
        # 攻击场景：注入恶意脚本窃取用户信息
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # ============================================
    # API 代理配置
    # ============================================
    # 将前端 API 请求转发到后端 Laravel 服务
    # ============================================
    
    location /api/ {
        # 代理目标地址
        # http://backend:8001/api/: 后端 Laravel 服务地址
        # 
        # backend: Docker 服务名称（自动解析为容器 IP）
        # 8001: 后端服务端口
        # /api/: 后端 API 路径前缀
        # 
        # 请求流程：
        # 前端请求: http://localhost:8080/api/landings
        # Nginx 代理: http://backend:8001/api/landings
        # Laravel 处理: Route::get('/api/landings', ...)
        proxy_pass http://backend:8001/api/;
        
        # ============================================
        # 代理请求头配置
        # ============================================
        # 将客户端真实信息传递给后端
        # ============================================
        
        # Host: 原始请求的主机名
        # $host: 客户端请求的 Host 头部
        # 作用：后端可以根据域名生成正确的 URL
        proxy_set_header Host $host;
        
        # X-Real-IP: 客户端真实 IP 地址
        # $remote_addr: 客户端 IP
        # 作用：后端可以获取真实访问者 IP（用于日志、限流等）
        proxy_set_header X-Real-IP $remote_addr;
        
        # X-Forwarded-For: 代理链中的所有客户端 IP
        # $proxy_add_x_forwarded_for: 追加当前客户端 IP
        # 格式: client, proxy1, proxy2, ...
        # 作用：多层代理时，后端可以获取原始客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # X-Forwarded-Proto: 原始请求协议
        # $scheme: http 或 https
        # 作用：后端可以生成正确的协议 URL（如重定向）
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ============================================
        # 代理超时配置
        # ============================================
        # 控制代理请求的超时时间
        # ============================================
        
        # 连接超时
        # 60s: 与后端建立连接的最长等待时间
        # 原因：网络延迟、后端启动慢时需要足够时间
        proxy_connect_timeout 60s;
        
        # 发送超时
        # 60s: 发送请求到后端的最长等待时间
        # 原因：大文件上传时需要更长发送时间
        proxy_send_timeout 60s;
        
        # 读取超时
        # 60s: 等待后端响应的最长时间
        # 原因：复杂查询、大数据处理可能需要较长时间
        proxy_read_timeout 60s;
        
        # ============================================
        # 代理缓冲配置
        # ============================================
        # 优化代理响应性能
        # ============================================
        
        # 启用代理缓冲
        # on: 缓冲后端响应，一次性发送给客户端
        # 优点：减少客户端等待时间，提升性能
        proxy_buffering on;
        
        # 缓冲区大小
        # 4k: 每个缓冲区的大小
        # 作用：存储响应头部和小部分响应体
        proxy_buffer_size 4k;
        
        # 缓冲区数量和大小
        # 8 4k: 8 个缓冲区，每个 4KB
        # 总缓冲大小: 8 × 4KB = 32KB
        # 作用：存储响应体数据
        proxy_buffers 8 4k;
    }
    
    # ============================================
    # 静态资源缓存配置
    # ============================================
    # 为静态资源设置长期缓存，提升加载速度
    # ============================================
    
    # 匹配静态资源文件扩展名
    # ~*: 不区分大小写的正则匹配
    # css: 样式文件
    # js: JavaScript 脚本
    # png/jpg/jpeg/gif: 图片文件
    # ico: 网站图标
    # svg: 矢量图
    # woff/woff2/ttf/eot: 字体文件
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 缓存过期时间
        # 1y: 1 年（31536000 秒）
        # 原因：静态资源通常不会频繁变化
        # 注意：资源更新时需要修改文件名（如 app.v2.js）
        expires 1y;
        
        # 缓存控制策略
        # public: 允许浏览器和 CDN 缓存
        # immutable: 资源永不变化，浏览器不会发送验证请求
        # 优点：大幅减少 HTTP 请求，提升性能
        add_header Cache-Control "public, immutable";
        
        # 关闭访问日志
        # off: 不记录静态资源访问日志
        # 原因：静态资源访问频繁，记录日志会占用大量磁盘空间
        access_log off;
    }
    
    # ============================================
    # 安全配置：禁止访问隐藏文件
    # ============================================
    
    # 匹配以点开头的文件/目录（隐藏文件）
    # ~: 正则匹配
    # \/: 路径分隔符
    # .: 点开头的文件名
    # 例如: .git/, .env, .htaccess
    location ~ /\. {
        # 拒绝所有访问
        # all: 拒绝所有 IP 的访问
        # 原因：隐藏文件可能包含敏感信息（如 .git 仓库、.env 配置）
        deny all;
        
        # 关闭访问日志
        # off: 不记录拒绝访问的日志
        # 原因：减少无意义的日志记录
        access_log off;
        
        # 不记录文件未找到日志
        # off: 不记录 404 错误
        # 原因：隐藏文件不存在时不记录错误日志
        log_not_found off;
    }
    
    # ============================================
    # 错误页面配置
    # ============================================
    
    # 404 错误处理
    # /index.html: 返回前端入口文件
    # 原因：单页应用（SPA）的前端路由需要 index.html 支持
    # 例如：访问 /landing（前端路由），Nginx 返回 index.html
    # 前端 JavaScript 会根据 URL 渲染对应页面
    error_page 404 /index.html;
    
    # 服务器错误处理
    # 500: 内部服务器错误
    # 502: 网关错误（后端服务不可达）
    # 503: 服务不可用（后端服务过载）
    # 504: 网关超时（后端响应超时）
    # /50x.html: 显示自定义错误页面
    error_page 500 502 503 504 /50x.html;
    
    # 50x 错误页面路径
    # =: 精确匹配（只匹配 /50x.html，不匹配 /50x.html/xxx）
    # root: 错误页面文件所在目录
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
